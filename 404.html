<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found &middot; Sonal Kandhway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,300;1,14..32,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 24px;
  }
  .glow-404 {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(91,123,248,.08) 0%, transparent 65%);
    pointer-events: none;
  }
  .num-bg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(10rem, 22vw, 18rem);
    font-weight: 700; line-height: 1; letter-spacing: -.04em;
    color: var(--ink-1); opacity: .04;
    pointer-events: none; user-select: none;
    font-family: var(--font-b);
  }
  .logo-wrap { margin-bottom: 48px; }
  .content { position: relative; z-index: 2; max-width: 520px; }
  .tag-404 {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent-dim); border: 1px solid var(--border-s);
    color: var(--accent); font-size: .68rem; letter-spacing: .1em;
    text-transform: uppercase; padding: 5px 14px;
    border-radius: 100px; margin-bottom: 28px;
    font-family: var(--font-m);
  }
  .title-404 {
    font-size: clamp(2.25rem, 5vw, 4rem);
    font-weight: 600; letter-spacing: -.03em;
    line-height: 1.1; color: var(--ink-1); margin-bottom: 16px;
  }
  .title-404 em { font-style: italic; font-weight: 300; color: var(--accent); }
  .body-404 {
    font-size: 1rem; color: var(--ink-2);
    line-height: 1.75; margin-bottom: 40px;
  }
  .btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn-p {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--accent); color: #fff;
    font-size: .9rem; font-weight: 500;
    padding: 13px 28px; border-radius: 100px;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 4px 20px rgba(91,123,248,.3);
    text-decoration: none; font-family: var(--font-b);
  }
  .btn-p:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(91,123,248,.4); }
  .btn-g {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .9rem; color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 100px;
    padding: 13px 24px; transition: border-color .2s, color .2s;
    text-decoration: none; font-family: var(--font-b);
  }
  .btn-g:hover { border-color: var(--border-s); color: var(--ink-1); }
  .theme-btn-404 {
    position: fixed; top: 20px; right: 20px;
    width: 40px; height: 22px; border-radius: 11px;
    background: var(--card); border: 1px solid var(--border-s);
    cursor: pointer; z-index: 100;
  }
  .knob-404 {
    position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    display: flex; align-items: center; justify-content: center;
    font-size: .55rem;
  }
  [data-theme="light"] .knob-404 { transform: translateX(18px); }
</style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="glow-404"></div>
<div class="num-bg">404</div>

<div class="logo-wrap">
  <img loading="eager" class="logo-dark" src="assets/images/logo-dark.svg" alt="Sonal Kandhway" height="72">
  <img loading="lazy" class="logo-light" src="assets/images/logo-white.svg" alt="Sonal Kandhway" height="72">
</div>

<main id="main" tabindex="-1" class="content">
  <div class="tag-404">404 &mdash; Page Not Found</div>
  <h1 class="title-404">Hmm, this page<br>went <em>missing.</em></h1>
  <p class="body-404">Looks like this page doesn't exist &mdash; or maybe it moved.<br>Let's get you back to somewhere useful.</p>
  <div class="btns">
    <a href="index.html" class="btn-p">&larr; Back to Portfolio</a>
    <a href="mailto:kandhwaysonal12@gmail.com" class="btn-g">Email Sonal &rarr;</a>
  </div>
</main>

<button class="theme-btn-404" id="tb404" aria-label="Toggle theme">
  <div class="knob-404" id="kn404"><span id="ti404">&#x1F319;</span></div>
</button>

<script>
const h = document.documentElement;
const ti = document.getElementById('ti404');
const kn = document.getElementById('kn404');
let dark = true;
document.getElementById('tb404').addEventListener('click', () => {
  dark = !dark;
  h.setAttribute('data-theme', dark ? 'dark' : 'light');
  ti.textContent = dark ? '\u{1F319}' : '\u2600';
});
</script>
<script>lucide.createIcons();</script>
</body>
</html>
