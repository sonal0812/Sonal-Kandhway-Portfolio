<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found · Sonal Kandhway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,300;1,14..32,400&display=swap" rel="stylesheet">
<style>
:root{--accent:#5B7BF8;--accent-2:#8BA3FF;--accent-dim:rgba(91,123,248,.10);--border-s:rgba(91,123,248,.22);--font-d:'Fraunces',Georgia,serif;--font-b:'Plus Jakarta Sans',system-ui,sans-serif;--font-m:'JetBrains Mono',monospace;--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.16,1,.3,1)}
[data-theme="dark"]{--bg:#070B17;--card:#131B30;--border:rgba(91,123,248,.10);--ink-1:#ECF0FF;--ink-2:#8B9BC8;--ink-3:#465070}
[data-theme="light"]{--bg:#F3F5FF;--card:#EBF0FF;--border:rgba(91,123,248,.12);--ink-1:#06102C;--ink-2:#2D3D6B;--ink-3:#8A95B8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink-1);font-family:var(--font-b);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;text-align:center;padding:24px}
.glow{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(91,123,248,.1) 0%,transparent 65%);pointer-events:none}
.logo-wrap{margin-bottom:48px}
[data-theme="dark"] .logo-d{display:block}[data-theme="dark"] .logo-l{display:none}
[data-theme="light"] .logo-d{display:none}[data-theme="light"] .logo-l{display:block}
.num{font-family:var(--font-d);font-size:clamp(8rem,20vw,14rem);font-weight:200;line-height:.9;letter-spacing:-.04em;color:var(--ink-1);opacity:.06;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;user-select:none;white-space:nowrap}
.content{position:relative;z-index:2;max-width:520px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--accent-dim);border:1px solid var(--border-s);color:var(--accent);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:28px;font-family:var(--font-m)}
.title{font-family:var(--font-d);font-size:clamp(2.5rem,6vw,4.5rem);font-weight:200;letter-spacing:-.025em;line-height:1.05;color:var(--ink-1);margin-bottom:16px}
.title em{font-style:italic;color:var(--accent-2)}
.body{font-size:1rem;color:var(--ink-2);line-height:1.75;margin-bottom:40px}
.btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn-p{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;font-size:.9rem;font-weight:500;padding:13px 28px;border-radius:100px;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 20px rgba(91,123,248,.3);text-decoration:none}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(91,123,248,.4)}
.btn-g{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink-2);border:1px solid var(--border);border-radius:100px;padding:13px 24px;transition:border-color .2s,color .2s;text-decoration:none}
.btn-g:hover{border-color:var(--border-s);color:var(--ink-1)}
.theme-btn{position:fixed;top:20px;right:20px;width:40px;height:22px;border-radius:11px;background:var(--card);border:1px solid var(--border-s);cursor:pointer;z-index:100}
.knob{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--accent);transition:transform .35s var(--ease-spring);display:flex;align-items:center;justify-content:center;font-size:.5rem}
[data-theme="light"] .knob{transform:translateX(18px)}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="glow"></div>
<div class="num">404</div>
<div class="logo-wrap">
  <img class="logo-d" src="assets/images/logo-dark.png" alt="Sonal Kandhway" height="72">
  <img class="logo-l" src="assets/images/logo-white.png" alt="Sonal Kandhway" height="72">
</div>
<main id="main" tabindex="-1" class="content">
  <div class="tag">404 — Page Not Found</div>
  <h1 class="title">Hmm, this page<br>went <em>missing.</em></h1>
  <p class="body">Looks like this page doesn't exist — or maybe it moved. Let's get you back to somewhere useful.</p>
  <div class="btns">
    <a href="index.html" class="btn-p">← Back to Portfolio</a>
    <a href="mailto:kandhwaysonal12@gmail.com" class="btn-g">Email Sonal →</a>
  </div>
</main>
<button class="theme-btn" id="tb"><div class="knob" id="kn"><span id="ti">🌙</span></div></button>
<script>
const html=document.documentElement,tb=document.getElementById('tb'),ti=document.getElementById('ti');
let d=true;
tb.addEventListener('click',()=>{d=!d;html.setAttribute('data-theme',d?'dark':'light');ti.textContent=d?'🌙':'☀️'});
</script>
</body>
</html>
